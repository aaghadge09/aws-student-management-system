services:
  backend:
    build: ./backend
    environment:
      PORT: 5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    environment:
      PORT: 3000
      API_URL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
